# Builds the Capacitor iOS app in frontend/ios and uploads it to TestFlight.
# Runs on GitHub's hosted Macs: no local Mac needed.
#
# Repository secrets (Settings > Secrets and variables > Actions):
#   ASC_KEY_ID      App Store Connect API key id (Users and Access > Integrations > Keys, role Admin)
#   ASC_ISSUER_ID   the issuer id shown above that key list
#   ASC_KEY_P8      the full text of the downloaded AuthKey_XXXX.p8 (BEGIN/END lines included)
# The Release configuration signs as "Apple Distribution" with automatic signing, so the
# App Store profile is created in the cloud from the API key and no device has to be registered.
#
# Repository variable:
#   APPLE_TEAM_ID   10-character Team ID (developer.apple.com > Membership details)
name: iOS TestFlight

on:
  workflow_dispatch:
  push:
    tags: ['v*']
  # TestFlight builds expire after 90 days; a monthly build keeps a fresh one waiting.
  schedule:
    - cron: '0 6 1 * *'

permissions:
  contents: read

concurrency:
  group: ios-testflight
  cancel-in-progress: false

jobs:
  testflight:
    runs-on: macos-26
    timeout-minutes: 60
    env:
      TEAM_ID: ${{ vars.APPLE_TEAM_ID }}
      ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
      ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Write the App Store Connect key
        env:
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
        run: |
          mkdir -p "$RUNNER_TEMP/asc"
          printf '%s\n' "$ASC_KEY_P8" > "$RUNNER_TEMP/asc/AuthKey.p8"
          echo "ASC_KEY_PATH=$RUNNER_TEMP/asc/AuthKey.p8" >> "$GITHUB_ENV"

      # Mobile flavour of the web app, copied into ios/ by `cap sync` (which also runs pod install).
      - name: Build the mobile bundle
        working-directory: frontend
        run: |
          npm ci
          npm run build:mobile

      - name: Archive
        working-directory: frontend/ios/App
        run: |
          VER="$(node -p "require('../../package.json').version")"
          xcodebuild -version
          xcodebuild -workspace App.xcworkspace -scheme App -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath "$RUNNER_TEMP/App.xcarchive" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$ASC_KEY_PATH" \
            -authenticationKeyID "$ASC_KEY_ID" \
            -authenticationKeyIssuerID "$ASC_ISSUER_ID" \
            MARKETING_VERSION="$VER" \
            CURRENT_PROJECT_VERSION="${{ github.run_number }}" \
            DEVELOPMENT_TEAM="$TEAM_ID" \
            archive | tail -60

      - name: Export and upload to TestFlight
        run: |
          cat > "$RUNNER_TEMP/ExportOptions.plist" <<PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0"><dict>
            <key>method</key><string>app-store-connect</string>
            <key>destination</key><string>upload</string>
            <key>teamID</key><string>${TEAM_ID}</string>
            <key>signingStyle</key><string>automatic</string>
            <key>manageAppVersionAndBuildNumber</key><false/>
          </dict></plist>
          PLIST
          xcodebuild -exportArchive \
            -archivePath "$RUNNER_TEMP/App.xcarchive" \
            -exportOptionsPlist "$RUNNER_TEMP/ExportOptions.plist" \
            -exportPath "$RUNNER_TEMP/export" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$ASC_KEY_PATH" \
            -authenticationKeyID "$ASC_KEY_ID" \
            -authenticationKeyIssuerID "$ASC_ISSUER_ID"

      - name: Remove the key
        if: always()
        run: rm -rf "$RUNNER_TEMP/asc"
